<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>变电站光伏 · 电气配置</title><link rel="stylesheet" href="pv_panel.css?v=20261101.9"><link rel="stylesheet" href="vendor/katex/katex.min.css?v=20261101.9"><link rel="stylesheet" href="pv_electrical.css?v=20261101.9"><link rel="stylesheet" href="pv_math.css?v=20261101.9"><script src="vendor/katex/katex.min.js?v=20261101.9" defer></script><script src="pv_math.js?v=20261101.9" defer></script><script src="pv_characteristics.js?v=20261101.9" defer></script><script src="pv_electrical_diagram.js?v=20261101.9" defer></script><script src="pv_string_plan.js?v=20261101.9" defer></script><script src="pv_electrical.js?v=20261101.9" defer></script></head>
<body><main>
<aside><section class="parameter-module"><h2 class="section-label">已选组件</h2><strong id="product">—</strong><p id="selection">—</p><button id="repick" class="secondary">重新选择</button><div id="catalogErrors" class="electrical-notice" hidden></div></section>
<form id="electricalForm" autocomplete="off">
<section class="parameter-module"><div class="electric-heading"><h2 class="section-label">组件参数</h2><button type="button" id="resetPresets" class="secondary">恢复预设</button></div><div id="moduleFields" class="electrical-fields"></div></section>
<section class="parameter-module"><h2 class="section-label">设计条件</h2><div id="designFields" class="electrical-fields"></div></section>
<section class="parameter-module"><h2 class="section-label">逆变器参数</h2><label class="device-label">型号<select id="inverterPreset"><option value="custom">自定义</option></select></label><label class="device-label">设备名称<input id="device_name" type="text" maxlength="100" placeholder="填写实际型号"></label><div id="inverterFields" class="electrical-fields"></div></section>
</form></aside>
<section class="electrical-workspace"><header class="electric-header"><h1 class="section-label">电气配置</h1><div class="electric-actions"><button id="save" class="secondary" disabled>保存配置</button><button id="export" class="secondary" disabled>导出电路 SVG / DXF</button></div></header>

<div id="status" role="status"></div>
<section class="string-plan" aria-labelledby="stringPlanHeading">
<div class="string-plan-heading"><h2 id="stringPlanHeading" class="section-label">组串方案</h2><div class="string-plan-actions"><label for="series_count">每串上限<select id="series_count" form="electricalForm"><option value="0">自动配置</option></select></label><button id="calculate" class="primary" type="submit" form="electricalForm">生成电气方案</button></div></div>
<div class="design-objectives" role="group" aria-label="优化目标">
<button type="button" data-objective="inverters" class="active" aria-pressed="true" title="优先减少逆变器台数，再减少总串数；在满足全部接入及电气约束的候选中比较。"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m5 19 14-14M7 8h3m4 8h3"/></svg>逆变器少</button>
<button type="button" data-objective="strings" aria-pressed="false" title="优先减少全系统总串数，再减少逆变器台数；在满足全部接入及电气约束的候选中比较。"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><rect x="6" y="4" width="4" height="6" rx="1"/><rect x="14" y="4" width="4" height="6" rx="1"/><rect x="6" y="14" width="4" height="6" rx="1"/><rect x="14" y="14" width="4" height="6" rx="1"/></svg>总串数少</button>
<button type="button" data-objective="balanced" aria-pressed="false" title="优先保持较少的逆变器台数，再缩小各台组串数的极差和离散程度；全部组件接入，仍逐路校核电气约束。"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9h4v11m2 0V9h4v11m2 0V9h4v11M3 5h18"/></svg>串数均衡</button>
</div>
<div class="string-plan-body"><div class="string-composition"><div id="seriesEquation" class="series-equation" aria-live="polite"></div><div id="seriesMatrix" class="series-matrix"></div><div id="seriesRemainder" class="series-remainder"></div></div><div class="series-plot"><div class="series-plot-heading"><span id="seriesMode">待计算</span><div><i class="ideal-key"></i><span id="idealLabel">m = N/n 参考</span><i class="feasible-key"></i><span>可行方案</span></div></div><div id="seriesChart" class="series-chart"></div></div></div>
</section>
<div class="electrical-metrics"><div><small>已接入 / 已选</small><strong id="connected">—</strong></div><div><small>组串 / 每串</small><strong id="strings">—</strong></div><div><small>逆变器</small><strong id="inverters">—</strong></div></div>
<nav class="view-tabs electrical-tabs"><button data-pane="characteristics" class="active">组件特性</button><button data-pane="constraints">约束校核</button><button data-pane="layout">组串排布</button><button data-pane="circuit">电路示意</button></nav>
<section id="characteristics" class="electrical-pane"><div class="curve-heading"><div><h2 class="section-label">组件电气特性</h2><p id="curveBasis" class="muted"></p></div><div class="curve-actions"><label id="importCurve" class="secondary curve-import" role="button" tabindex="0" aria-label="导入组件实测I–V曲线" title="导入厂家实测电压—电流CSV，用于曲线对比。必填列：voltage_v、current_a；可选辐照度和温度，不改变逐时发电量数据。"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg>导入 I–V 曲线<input id="curveFile" type="file" accept=".csv,.tsv,.txt" hidden></label><button id="clearCurves" class="secondary" type="button" hidden>恢复参数曲线</button></div></div><div class="curve-grid"><article><div id="ivCurve"></div><p id="ivStatus" class="muted"></p></article><article><div id="temperatureCurve"></div><p id="temperatureStatus" class="muted"></p></article></div><section class="curve-data-help" aria-labelledby="curveFormulaHeading"><h2 class="section-label" id="curveFormulaHeading">计算公式</h2><div class="curve-grid curve-formula-grid"><article class="curve-formula-card"><h3>电流与功率</h3><div class="math-equation" data-tex="I(V)=I_{\mathrm{sc}}\left[1-\left(\frac{V}{V_{\mathrm{oc}}}\right)^k\right]^m,\quad P=VI"></div></article><article class="curve-formula-card"><h3>温度修正</h3><div class="math-equation" data-tex="\frac{X(T)}{X(25^{\circ}\mathrm C)}=1+\mu_X(T-25)"></div></article></div></section></section>
<section id="constraints" class="electrical-pane" hidden><h2 class="section-label">电气约束校核</h2><div id="formulae" class="formula-grid"></div><div class="formula-symbols"><span>n：每串上限</span><span>nₛ：各串块数</span><span>m：全系统总串数</span><span>Nₚ：每路并联串数</span><span>N：所选组件数</span><span>kI：短路电流系数</span></div><div class="formula-scope" aria-label="尚未纳入的校核"><b>未纳入</b><span>启动条件</span><span>满载范围</span><span>逐路差异</span><span>逐时电气损耗</span><span>电缆与保护</span></div><section class="shading-explanation" aria-labelledby="shadingPowerHeading"><h2 class="section-label" id="shadingPowerHeading">遮挡与功率</h2><div class="shading-model-grid"><article class="formula-card"><strong>面积近似</strong><div class="electric-flow"><span>受光面积 f</span><i>→</i><span>出力 P′</span></div><div class="formula-answer"><div class="math-equation" data-tex="P'\approx fP"></div></div></article><article class="formula-card"><strong>电气工作点</strong><div class="electric-flow"><span>辐照 G</span><i>→</i><span>I–V</span><i>→</i><span>MPPT</span></div><div class="formula-answer"><div class="math-equation" data-tex="P_{\mathrm{MPP}}=\max_V\bigl[VI(V)\bigr]"></div></div></article></div></section></section>
<section id="layout" class="electrical-pane" hidden><h2 class="section-label">组串排布</h2><div id="stringLegend" class="string-legend" aria-label="组串颜色图例"></div><div id="map" class="electrical-map"></div><div id="assignments"></div></section>
<section id="circuit" class="electrical-pane" hidden><div class="pane-heading"><h2 class="section-label">电路示意</h2></div><div id="diagram"></div><div id="circuitSummary" class="circuit-summary"></div></section>
</section></main></body></html>
